schema_version: 1
name: reference-paper 实际版式参考（非官方规范声明）
source_template: C:\paper-workspace\01 模板库\华为杯\01 模板与参考论文\reference-paper.docx
extraction_notes:
- 从代表性段落实际格式提取；不以 Normal 样式替代正文取样。
- 封面、学校/队员信息、目录与页码不复制。
- 公式保留原生 OMath；参考文件多数公式为 MathType/OLE，不能照搬对象类型。公式采用已有安全最小行距并沿用中心/右制表位。
- 表格格式按正文第3张参数表取样（其他宽表有不同字号与行距）。
- 图片保持原尺寸，超出新正文宽度时才缩小。
